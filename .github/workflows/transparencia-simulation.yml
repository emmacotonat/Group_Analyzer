name: Synthetic transparency simulation
on:
  push:
    paths: ['simulation/**', '.github/workflows/transparencia-simulation.yml']
  pull_request:
    paths: ['simulation/**', '.github/workflows/transparencia-simulation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s simulation -p 'test_*.py'
      - run: python simulation/generate.py
      - name: Verify committed results are reproducible
        run: git diff --exit-code -- simulation/output
